{% extends "base.html" %}
{% block content %}
<a class="back-link" href="{{ url('blog.html') }}">← 返回博客</a>
<h1>{{ title }}</h1>
<div class="post-meta"><time datetime="{{ post.date }}">{{ post.date }}</time><span>·</span><a href="{{ url('blog.html') }}?category={{ post.category | urlencode }}">{{ post.category }}</a></div>
<div class="prose">{{ body | safe }}</div>
<div class="post-bottom"><a href="{{ url('blog.html') }}">← 查看全部文章</a></div>
{% endblock %}
